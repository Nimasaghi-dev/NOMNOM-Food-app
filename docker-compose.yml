# Local PostgreSQL for the NOMNOM Food app.
# Start it with:  docker compose up -d
# Stop it with:   docker compose down   (add -v to also delete the data)
services:
  db:
    image: postgres:16-alpine
    container_name: nomnom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nomnom
      POSTGRES_PASSWORD: nomnom
      POSTGRES_DB: nomnom
    # Host port 5433 (5432 is already used by another container on this machine)
    ports:
      - "5433:5432"
    volumes:
      - nomnom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomnom -d nomnom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nomnom-pgdata:
